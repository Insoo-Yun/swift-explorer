[package]
name = "hizli-gezgin"
version = "0.1.0"
edition = "2021"
description = "A Windows file manager that looks and works like the Windows 11 File Explorer"
license = "MIT"
repository = "https://github.com/misutesu-desu/hizli-gezgin"
readme = "README.md"
rust-version = "1.82"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_extras = "0.31"
rayon = "1"
notify = "8"
trash = "5"
open = "5"
clipboard-win = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Globalization"] }

windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }
windows-core = "0.58"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
