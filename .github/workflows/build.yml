name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: swift-explorer.exe
            asset: SwiftExplorer.exe
          - os: ubuntu-22.04
            bin: swift-explorer
            asset: swift-explorer-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: Package tar.gz
        if: runner.os == 'Linux'
        run: |
          mkdir swift-explorer
          cp target/release/swift-explorer LICENSE swift-explorer/
          cp packaging/linux/io.github.misutesu_desu.SwiftExplorer.desktop packaging/linux/io.github.misutesu_desu.SwiftExplorer.metainfo.xml swift-explorer/
          cp assets/icon.png swift-explorer/io.github.misutesu_desu.SwiftExplorer.png
          chmod 755 swift-explorer/swift-explorer
          tar -czf "${{ matrix.asset }}.tar.gz" swift-explorer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}*

  # Uygulama yeni sürümü API yerine bu dosyadan öğrenir: istek sınırı yok
  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwiftExplorer.exe
      - name: Write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          sha=$(sha256sum SwiftExplorer.exe | cut -d' ' -f1)
          jq -n --arg v "$version" --arg page "$base/tag/$GITHUB_REF_NAME"             --arg url "$base/download/$GITHUB_REF_NAME/SwiftExplorer.exe" --arg sha "$sha"             '{version: $v, page: $page, windows: {url: $url, sha256: $sha}}' > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  flatpak-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cargo-sources.json
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install aiohttp tomlkit pyyaml
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          /tmp/venv/bin/python flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: cargo-sources.json

  flatpak:
    needs: flatpak-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: swift-explorer.flatpak
          manifest-path: packaging/flatpak/io.github.misutesu_desu.SwiftExplorer.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: swift-explorer.flatpak
